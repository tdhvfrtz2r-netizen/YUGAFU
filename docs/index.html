<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F5F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="行测真题库">

<body>
<title>行测真题库</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 答题卡：浅蓝灰纸面，铅笔蓝做主色，红笔判错，绿色判对。单栏手机布局，底部四个标签。 */
:root {
  --bg: #F3F5F8; --card: #FFFFFF; --ink: #17202E; --mute: #5E6B7D; --line: #DCE2EA;
  --acc: #1D5BD6; --acc-soft: #E3ECFC; --ok: #13804A; --ok-soft: #E2F4EA; --bad: #C73A2E; --bad-soft: #FBE7E4;
  --warn: #B26B00; --img-bg: #FFFFFF;
  --c0: #7A5AF8; --c1: #E08A00; --c2: #1D5BD6; --c3: #D2417A; --c4: #13804A; --c5: #0E8FA8;
  --fs: 17px;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F141B; --card: #18202B; --ink: #E7ECF3; --mute: #93A0B2; --line: #2A3442;
  --acc: #6E9CFF; --acc-soft: #1E2C47; --ok: #45C483; --ok-soft: #15301F; --bad: #FF7A6B; --bad-soft: #3A1D1A;
  --warn: #F0B04A; --img-bg: #F4F4F4;
  --c0: #A08BFF; --c1: #F0A93A; --c2: #6E9CFF; --c3: #F07AA8; --c4: #45C483; --c5: #3FC2DB; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0F141B; --card: #18202B; --ink: #E7ECF3; --mute: #93A0B2; --line: #2A3442;
  --acc: #6E9CFF; --acc-soft: #1E2C47; --ok: #45C483; --ok-soft: #15301F; --bad: #FF7A6B; --bad-soft: #3A1D1A;
  --warn: #F0B04A; --img-bg: #F4F4F4;
  --c0: #A08BFF; --c1: #F0A93A; --c2: #6E9CFF; --c3: #F07AA8; --c4: #45C483; --c5: #3FC2DB; color-scheme: dark }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
[hidden] { display: none !important }
html, body { background: var(--bg) }
body { color: var(--ink); font: 15px/1.6 var(--sans); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 calc(76px + env(safe-area-inset-bottom, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg) }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0 }
button:focus-visible, [data-go]:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px }
#app { max-width: 720px; margin: 0 auto }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; min-height: 56px }
.top h1 { font-size: 20px; margin: 0; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.back { font-size: 28px; line-height: 1; width: 32px; height: 36px; color: var(--acc) }
.chip { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 5px 12px; font-size: 14px; white-space: nowrap }
.chip.on { background: var(--acc); color: #fff; border-color: var(--acc) }
.sub { color: var(--mute); font-size: 13px }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px }
.card h2 { font-size: 16px; margin: 0 0 10px; display: flex; align-items: baseline; gap: 8px }
.card h2 small { margin-left: auto; font-weight: 400; color: var(--mute); font-size: 13px }
.hello { font-size: 18px; font-weight: 600; margin: 8px 0 2px }
.stats3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center }
.stat b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.3 }
.stat span { color: var(--mute); font-size: 12px }
.primary { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--acc); color: #fff; border-radius: 14px; padding: 16px; margin-bottom: 12px }
.primary b { font-size: 18px; display: block }
.primary span { opacity: .85; font-size: 13px }
.primary .go { margin-left: auto; font-size: 24px }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; text-align: left; min-height: 82px; display: flex; flex-direction: column; gap: 2px }
.tile b { font-size: 16px }
.tile span { color: var(--mute); font-size: 12.5px }
.tile i { font-style: normal; font-size: 20px; color: var(--acc) }
.list { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 12px }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-top: 1px solid var(--line); width: 100%; text-align: left }
.row:first-child { border-top: 0 }
.row .m { flex: 1; min-width: 0 }
.row .m b { display: block; font-weight: 500; font-size: 15px }
.row .m span { color: var(--mute); font-size: 12.5px }
.row .go { color: var(--mute); font-size: 20px }
.btn { display: inline-flex; align-items: center; justify-content: center; border-radius: 10px; padding: 9px 14px; background: var(--acc); color: #fff; font-weight: 500; white-space: nowrap }
.btn.ghost { background: var(--acc-soft); color: var(--acc) }
.btn.line { background: none; border: 1px solid var(--line); color: var(--ink) }
.btn.sm { padding: 6px 11px; font-size: 13.5px }
.btn.block { display: flex; width: 100% }
.btn.danger { background: var(--bad-soft); color: var(--bad) }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 6px }
.bar i { display: block; height: 100%; background: var(--acc); border-radius: 3px }
.yr { font-size: 13px; color: var(--mute); margin: 14px 2px 6px; font-weight: 600 }
.seg { display: flex; background: var(--line); border-radius: 10px; padding: 3px; margin-bottom: 12px }
.seg button { flex: 1; padding: 7px; border-radius: 8px; font-size: 14px; color: var(--mute) }
.seg button.on { background: var(--card); color: var(--ink); font-weight: 600 }
.regions { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px }
.regions button { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 9px 4px; font-size: 14px; line-height: 1.3 }
.regions button span { display: block; font-size: 11px; color: var(--mute) }
.regions button.on { border-color: var(--acc); background: var(--acc-soft); color: var(--acc) }
.note { color: var(--mute); font-size: 12px; text-align: center; margin: 16px 8px; line-height: 1.7 }
.empty { text-align: center; color: var(--mute); padding: 48px 0 }
.badge { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; background: var(--acc-soft); color: var(--acc); font-weight: 500; vertical-align: 2px }
.badge.ok { background: var(--ok-soft); color: var(--ok) }
.badge.bad { background: var(--bad-soft); color: var(--bad) }

/* 做题 */
.qhead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 2px 0 10px; font-size: 12.5px; color: var(--mute) }
.qbody { font-size: var(--fs); line-height: 1.75 }
.qbody p { margin: 0 0 .5em }
.qbody img, .mat img, .exp img { max-width: 100%; height: auto; background: var(--img-bg); border-radius: 4px; vertical-align: middle }
.qbody img.fx, .mat img.fx, .exp img.fx, .opt img.fx { background: none; border-radius: 0 }
img[data-i]:not([src]) { min-height: 40px; min-width: 60px; background: var(--line); border-radius: 4px }
img.fx[data-i]:not([src]) { min-height: 1em; min-width: 2em }
:root[data-theme="dark"] img.fx { filter: invert(.88) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) img.fx { filter: invert(.88) } }
.qbody table, .mat table, .exp table { border-collapse: collapse; font-size: .85em; margin: 6px 0 }
.qbody td, .qbody th, .mat td, .mat th, .exp td, .exp th { border: 1px solid var(--line); padding: 3px 6px }
.tw { overflow-x: auto; max-width: 100% }
.mat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; font-size: calc(var(--fs) - 1px); line-height: 1.7 }
.mat-h { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--mute) }
.mat-h button { color: var(--acc); font-size: 13px }
.mat-b { padding: 10px 12px; overflow-x: auto }
.mat.fold .mat-b { max-height: 38vh; overflow-y: auto }
.mat-b p { margin: 0 0 .5em }
.opts { display: flex; flex-direction: column; gap: 8px; margin: 14px 0 }
.opts.row4 { flex-direction: row }
.opts.row4 .opt { flex: 1; justify-content: center }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 12px; font-size: var(--fs); line-height: 1.6 }
.opt .ok { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 14px; font-weight: 600; margin-top: 1px }
.opt .ot { min-width: 0; flex: 1; overflow-wrap: anywhere }
.opt.sel { border-color: var(--acc); background: var(--acc-soft) }
.opt.sel .ok { background: var(--acc); border-color: var(--acc); color: #fff }
.opt.right { border-color: var(--ok); background: var(--ok-soft) }
.opt.right .ok { background: var(--ok); border-color: var(--ok); color: #fff }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft) }
.opt.wrong .ok { background: var(--bad); border-color: var(--bad); color: #fff }
.fb { display: flex; align-items: center; justify-content: space-between; border-radius: 12px; padding: 11px 14px; margin-bottom: 10px; font-weight: 600 }
.fb.ok { background: var(--ok-soft); color: var(--ok) }
.fb.bad { background: var(--bad-soft); color: var(--bad) }
.fb.memo { background: var(--acc-soft); color: var(--acc) }
.fb small { font-weight: 400; font-size: 12.5px }
.exp { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: calc(var(--fs) - 1px); line-height: 1.75; overflow-x: auto }
.exp-h { font-weight: 600; font-size: 14px; color: var(--acc); margin-bottom: 4px }
.exp p { margin: 0 0 .55em }
.qnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); display: flex; gap: 8px; padding: 8px max(16px, env(safe-area-inset-right, 0px)) calc(8px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
.qnav .btn { flex: 1; padding: 12px }
.qnav .btn.line { flex: 0 0 auto; min-width: 88px }
.timer { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--acc); font-size: 15px }
.timer.low { color: var(--bad) }
.icon { font-size: 20px; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--mute) }
.icon.on { color: var(--warn) }
.prog { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--mute) }
.loadbox { text-align: center; padding: 60px 0; color: var(--mute) }

/* 答题卡 / 弹层 */
#sheet { position: fixed; inset: 0; z-index: 20; background: rgba(10, 16, 26, .45); display: flex; align-items: flex-end }
#sheet .pane { background: var(--bg); width: 100%; max-height: 82vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
#sheet h3 { margin: 0 0 12px; font-size: 17px; display: flex; justify-content: space-between; align-items: center }
#sheet h3 button { color: var(--mute); font-size: 20px; width: 32px }
.cardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(40px, 1fr)); gap: 7px; margin-bottom: 12px }
.cardgrid button { height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--card); font-size: 13.5px; font-variant-numeric: tabular-nums }
.cardgrid button.a { background: var(--acc-soft); border-color: var(--acc); color: var(--acc) }
.cardgrid button.r { background: var(--ok-soft); border-color: var(--ok); color: var(--ok) }
.cardgrid button.w { background: var(--bad-soft); border-color: var(--bad); color: var(--bad) }
.cardgrid button.cur { outline: 2px solid var(--ink); outline-offset: 1px }
.opt-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px }
.fld { font-size: 13px; color: var(--mute); margin-top: 4px }

/* 底部标签 */
#tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line); display: flex; padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)) }
#tabs button { flex: 1; display: flex; flex-direction: column; align-items: center; padding: 7px 0 6px; font-size: 11.5px; color: var(--mute) }
#tabs button i { font-style: normal; font-size: 20px; line-height: 1.2 }
#tabs button.on { color: var(--acc); font-weight: 600 }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 30; max-width: 86vw; text-align: center }

/* 成绩 / 分析 */
.score { text-align: center; padding: 6px 0 4px }
.score b { font-size: 52px; line-height: 1.1; color: var(--acc); font-variant-numeric: tabular-nums }
.score b small { font-size: 18px }
.score span { display: block; color: var(--mute); font-size: 13px }
table.t { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums }
table.t th { color: var(--mute); font-weight: 500; text-align: right; padding: 6px 4px; border-bottom: 1px solid var(--line); white-space: nowrap }
table.t td { text-align: right; padding: 7px 4px; border-bottom: 1px solid var(--line); white-space: nowrap }
table.t th:first-child, table.t td:first-child { text-align: left }
table.t tr.hl td { background: var(--acc-soft) }
.hbar { display: grid; grid-template-columns: 5.6em 1fr 3.6em; gap: 8px; align-items: center; font-size: 13.5px; margin: 7px 0 }
.hbar .tr { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden }
.hbar .tr i { display: block; height: 100%; border-radius: 5px; background: var(--acc) }
.hbar em { font-style: normal; text-align: right; font-variant-numeric: tabular-nums; color: var(--mute) }
.hbar .lb { overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.stack { display: flex; height: 16px; border-radius: 4px; overflow: hidden; flex: 1 }
.stack i { display: block; height: 100% }
.srow { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin: 5px 0; font-variant-numeric: tabular-nums }
.srow span { width: 2.6em; color: var(--mute) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; color: var(--mute); margin-top: 8px }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: -1px }
.words { display: flex; flex-wrap: wrap; gap: 6px }
.words span { background: var(--acc-soft); color: var(--ink); border-radius: 6px; padding: 3px 8px; font-size: 13.5px }
.words span em { font-style: normal; color: var(--mute); font-size: 11.5px; margin-left: 3px }
.chart { width: 100%; height: auto; display: block }
.chart text { fill: var(--mute); font-size: 10px; font-family: var(--sans) }
.tip { background: var(--acc-soft); border-radius: 12px; padding: 12px 14px; margin-bottom: 12px; font-size: 14px; line-height: 1.7 }
.tip b { color: var(--acc) }
.tw2 { overflow-x: auto }
input[type=range] { width: 100%; accent-color: var(--acc) }
.switch { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border-top: 1px solid var(--line) }
.switch:first-child { border-top: 0 }
.tg { width: 46px; height: 28px; border-radius: 99px; background: var(--line); position: relative; flex: none }
.tg::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .15s }
.tg.on { background: var(--acc) }
.tg.on::after { left: 21px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
@media (max-width: 360px) { .regions { grid-template-columns: repeat(3, 1fr) } }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>

<main id="app"><div class="loadbox">正在打开题库…</div></main>

  <button data-tab="home"><i>⌂</i>首页</button>
  <button data-tab="bank"><i>▤</i>题库</button>
  <button data-tab="wrong"><i>✎</i>错题</button>
  <button data-tab="ana"><i><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 17h14M5 14V9M10 14V4M15 14v-7" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg></i>分析</button>
</nav>
<div id="sheet" hidden></div>

<script>
'use strict';
// 行测真题库：题库数据按需加载（t/ 题目分片、i/ 图片包），做题记录存本机并同步到 Claude 账号。
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const app = $('#app');
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const fmtT = s => { s = Math.max(0, Math.round(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(x).padStart(2, '0'); };
const today = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const W = [0.7, 0.6, 0.8, 0.9, 0.7, 1.0]; // 估分权重：政治、常识、言语、数量、判断、资料
const SHORT = ['政治', '常识', '言语', '数量', '判断', '资料'];

// ---------- 记录 ----------
// rec[qid%16][qid] = [最近一次对错, 做过几次, 错过几次, 时间(分钟)]；wrong/star 分 4 桶
const KEY = 'xc-v2';
// rv[qid%4][qid] = [复习阶段, 到期日 YYYYMMDD]：做错 → 1 天后复习；到期答对 1 次 → 3 天后再复习；到期再答对 → 移出错题本
const NB = { rec: 16, wrong: 4, star: 4, rv: 4 };
const DEF = () => ({ region: null, fs: 17, autoNext: false, last: null, ex: {}, hist: [], day: {}, daily: null,
  rec: Array.from({ length: 16 }, () => ({})), wrong: Array.from({ length: 4 }, () => ({})), star: Array.from({ length: 4 }, () => ({})), rv: Array.from({ length: 4 }, () => ({})), _ut: {} });
let S = DEF();
try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o) S = Object.assign(DEF(), o); } catch (e) { /* 读不到就用默认 */ }
const dirty = new Set();
let saveT = 0;
function touch(b) { S._ut[b] = Date.now(); dirty.add(b); save(); }
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 存不下 */ } sync.kick(); }, 300);
}
const rec = q => S.rec[q % 16][q];
const isWrong = q => !!S.wrong[q % 4][q];
const isStar = q => !!S.star[q % 4][q];
function setBook(name, q, on) {
  const b = S[name][q % 4];
  if (on) b[q] = Date.now(); else delete b[q];
  touch(name + (q % 4));
}
const bookList = name => S[name].flatMap(b => Object.entries(b)).sort((a, b) => b[1] - a[1]).map(([q]) => +q);
function record(q, ok, sec) {
  const r = S.rec[q % 16][q] || [0, 0, 0, 0];
  S.rec[q % 16][q] = [ok ? 1 : 0, r[1] + 1, r[2] + (ok ? 0 : 1), Math.round(Date.now() / 6e4)];
  touch('rec' + (q % 16));
  const d = today(), dd = S.day[d] || [0, 0, 0];
  S.day[d] = [dd[0] + 1, dd[1] + (ok ? 1 : 0), dd[2] + Math.min(600, Math.round(sec || 0))];
  touch('core');

        const body = d.data(); if (!body) continue; seen.add(d.id);

function submitExam() {
  clearInterval(timerId); lapQ();
  const sp = SES.sp, p = P(sp.pid), ex = SES.ex;
  let ok = 0, n = 0, wsum = 0, wok = 0;
  const mods = p.mods.map(([mi, st, cnt]) => {
    let a = 0, b = 0, t = 0;
    for (let i = st; i < st + cnt; i++) {
      const q = p.q[i], d = QT[q]; t += ex.tt[i] || 0;
      if (!d || !d.a) continue;
      b++; wsum += W[mi];
      const c = ex.a[i];
      if (c === d.a) { a++; wok += W[mi]; }
      if (c != null) record(q, c === d.a, ex.tt[i]);
    }
    ok += a; n += b;
    return [mi, a, b, Math.round(t)];
  });
  ex.done = true;
  ex.res = { score: Math.round(1000 * wok / (wsum || 1)) / 10, ok, n, used: ex.used, blank: p.q.filter((q, i) => QT[q] && QT[q].a && ex.a[i] == null).length, mods, at: Date.now() };
  S.hist.push([Date.now(), sp.pid, ex.res.score, ok, n, ex.used]);
  if (S.hist.length > 200) S.hist = S.hist.slice(-200);
  touch('core');
  SES = null;
  STACK[STACK.length - 1] = 'report/' + sp.pid;
  render();
}
const SUG = [30, 30, 50, 80, 50, 70]; // 每题建议用时（秒）：政治、常识、言语、数量、判断、资料
function finish() {
  const n = SES.doneN, ok = SES.okN;
  // 本组按模块汇总：[答对, 做了, 用时]
  const mods = {}, wrongI = [];
  let used = 0, slow = null;
  SES.qids.forEach((q, i) => {
    const c = SES.picked[q]; if (c == null || !QT[q].a) return;
    const mi = qMod(q), t = SES.tt[q] || 0, m = mods[mi] ||= [0, 0, 0];
    m[1]++; m[2] += t; used += t;
    if (c === QT[q].a) m[0]++; else wrongI.push(i);
    if (t > SUG[mi] * 1.5 && (!slow || t / SUG[mi] > slow.t / SUG[slow.mi])) slow = { i, mi, t };
  });
  const rows = Object.entries(mods).map(([mi, [a, b, t]]) => `<div class="row"><span class="m"><b>${MN()[mi]}</b><span>平均每题 ${Math.round(t / b)} 秒 · 建议 ${SUG[mi]} 秒</span></span><b style="font-weight:600;${a < b ? 'color:var(--bad)' : ''}">${a}/${b}</b></div>`).join('');
  const wn = n - ok;

    ${slow ? `<button class="row" id="slow" style="border:1px solid var(--line);border-radius:14px;margin-bottom:10px"><span class="m"><b>最慢的一题：第 ${slow.i + 1} 题</b><span>${MN()[slow.mi]} · 用了 ${fmtT(slow.t)}，建议 ${SUG[slow.mi]} 秒左右 · 点击回看</span></span><span class="go">›</span></button>` : ''}`
    : '<p>可以去错题本复习，或者换一组继续。</p>'}
    <div class="grid2" style="margin-top:12px">${wn ? '<button class="btn line" id="seeW">看错题解析</button>' : '<button class="btn line" id="again">从头再看</button>'}<button class="btn" id="done">返回</button></div>`);
  const at = i => { closeSheet(); lapQ(); SES.i = i; SES.sel = ''; renderQ(); };
  const on = (id, fn) => { const e = s.querySelector('#' + id); if (e) e.onclick = fn; };
  on('slow', () => at(slow.i));

  on('again', () => { closeSheet(); SES.i = 0; SES.picked = {}; SES.tt = {}; SES.msg = {}; SES.doneN = SES.okN = 0; renderQ(); });
  $('#done').onclick = () => { closeSheet(); S.last = null; touch('core'); back(); };
}

    ${st.law.length ? `<div class="card"><h2>法律常识：解析里最常引用的法律</h2>${st.law.slice(0, 12).map(([w, n]) => `<div class="hbar" style="grid-template-columns:8em 1fr 2.6em"><span class="lb">${esc(w)}</span><span class="tr"><i style="width:${100 * n / lawMax}%;background:var(--c1)"></i></span><em>${n}</em></div>`).join('')}</div>` : ''}
    <div class="card"><h2>单选题答案分布 <small>去重后 ${ansN.toLocaleString()} 道</small></h2><table class="t"><tr><th>模块</th><th>A</th><th>B</th><th>C</th><th>D</th></tr>
      ${st.ans.map((a, mi) => { const t = a.reduce((x, y) => x + y, 0); return `<tr><td>${MN()[mi]}</td>${a.map(v => `<td>${pct(v, t)}%</td>`).join('')}</tr>`; }).join('')}<tr><td><b>合计</b></td>${ansT.map(v => `<td><b>${pct(v, ansN)}%</b></td>`).join('')}</tr></table>
      <div class="sub" style="margin-top:8px">四个选项基本各占四分之一，蒙题没有捷径，会的题一定要做对。</div></div>
    <div class="card"><h2>一道题被几套卷用过</h2>${reuse.map(([k, n]) => `<div class="hbar" style="grid-template-columns:4.4em 1fr 4em"><span class="lb">${k >= 10 ? '10 套以上' : k + ' 套'}</span><span class="tr"><i style="width:${100 * n / rmax}%"></i></span><em>${n.toLocaleString()}</em></div>`).join('')}</div>
    <div class="note">网友回忆版题库，个别卷不完整，统计看趋势就好。题型沿用题库原始标注。</div>`;
}

// ---------- 设置 ----------

  tabs(null);
  const tt = totals();
  app.innerHTML = hdr('设置') + `<div class="card"><h2>题目字号 <small id="fsv">${S.fs}px</small></h2><input type="range" id="fs" min="14" max="22" step="1" value="${S.fs}"><div class="qbody" style="font-size:${S.fs}px" id="fsd">下列各句中，没有语病的一项是：</div></div>
    <div class="list"><div class="switch"><span>答对自动跳到下一题<div class="sub">答错时会停下来让你看解析</div></span><button class="tg ${S.autoNext ? 'on' : ''}" id="an" aria-label="答对自动下一题"></button></div>
    <button class="row" data-go="pick"><span class="m"><b>考试地区</b><span>${esc(S.region || '未选择')}</span></span><span class="go">›</span></button></div>
    <div class="card" id="offc" hidden><h2>离线使用 <small id="offs"></small></h2><div class="sub">把全部题目和图片（约 120 MB）存到手机里，之后没网也能刷。建议连着 Wi-Fi 下载，下载时请保持页面打开。</div><div class="bar" style="margin-top:10px"><i id="offb" style="width:0"></i></div><button class="btn sm" id="offg" style="margin-top:10px">下载全部题库</button></div>
    <div class="card"><h2>做题记录</h2><div class="sub">做过 ${tt.done} 道 · 错题 ${tt.wrong} · 收藏 ${tt.star} · 模考 ${S.hist.length} 次<br>${esc(sync.state)}</div>
      <button class="btn danger sm" id="clr" style="margin-top:10px">清空全部记录</button></div>
    <div class="card"><h2>关于题库</h2><div class="sub">2016–2026 年国考、31 个省区市省考、深圳/广州市考、选调，${IDX.stats.papers} 套卷。题目为网友回忆版，个别题缺图；答案和解析来自开源项目 ERRRC/xingcezhenti（github.com/ERRRC/xingcezhenti），版权归原出处。</div></div>`;
  offlineUI();
  const fs = $('#fs');
  fs.oninput = () => { S.fs = +fs.value; $('#fsv').textContent = S.fs + 'px'; $('#fsd').style.fontSize = S.fs + 'px'; document.documentElement.style.setProperty('--fs', S.fs + 'px'); };
  fs.onchange = () => touch('core');
  $('#an').onclick = () => { S.autoNext = !S.autoNext; touch('core'); $('#an').classList.toggle('on', S.autoNext); };
  $('#clr').onclick = () => {
    sheet(`<h3>清空全部记录？<button data-close>✕</button></h3><p>做题记录、错题本、收藏和模考成绩都会删除，不能恢复。</p><div class="grid2"><button class="btn line" data-close>取消</button><button class="btn danger" id="yes">确定清空</button></div>`);
    $('#yes').onclick = () => { const keep = { region: S.region, fs: S.fs }; S = Object.assign(DEF(), keep); for (const b of ['core', ...Array.from({ length: 16 }, (_, i) => 'rec' + i), ...[0, 1, 2, 3].flatMap(i => ['wrong' + i, 'star' + i])]) touch(b); closeSheet(); toast('已清空'); settings(); };
  };
}

// ---------- 离线下载 ----------
async function offlineUI() {
  if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller || !window.caches) return;
  const card = $('#offc'); if (!card) return; card.hidden = false;
  const nT = 66, nI = IDX.nI || 130, total = nT + nI;
  const urls = [...Array.from({ length: nT }, (_, i) => `t/${i}.txt`), ...Array.from({ length: nI }, (_, i) => `i/${i}.txt`)];
  const c = await caches.open('xingce-v1');
  const have = async () => (await Promise.all(urls.map(u => c.match(u)))).filter(Boolean).length;
  const show = n => { $('#offs').textContent = n >= total ? '已全部下载 ✓' : `已下载 ${n}/${total}`; $('#offb').style.width = pct(n, total) + '%'; $('#offg').hidden = n >= total; };
  show(await have());
  $('#offg').onclick = async () => {
    const btn = $('#offg'); btn.disabled = true; btn.textContent = '下载中…';
    let n = await have(), fail = 0;
    const todo = urls.filter(() => true);
    let k = 0;
    const worker = async () => { while (k < todo.length) { const u = todo[k++]; try { if (!(await c.match(u))) { const r = await fetch(u); if (!r.ok) throw 0; await c.put(u, r); } n++; show(n); } catch (e) { fail++; } } };
    await Promise.all([worker(), worker(), worker()]);
    btn.disabled = false; btn.textContent = '下载全部题库';
    if (fail) toast(`有 ${fail} 个文件没下载成功，再点一次继续`);
    show(await have());
  };
}

// ---------- 进入密码 ----------
// 只挡住拿到链接的普通人：纯前端没法真正保密。存的是密码的 FNV-1a 哈希，改密码就换这个数
const PW_HASH = 3471793015, PW_KEY = 'xc-pw';
const pwHash = t => { let h = 0x811c9dc5; for (const c of t) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619) >>> 0; } return h; };
function gate() {
  let ok = !!window.claude; // 私有版只有本人能开，不用密码
  try { ok ||= localStorage.getItem(PW_KEY) === String(PW_HASH); } catch (e) { }
  if (ok) return Promise.resolve();
  tabs(null);
  app.innerHTML = `<div class="top"><h1>行测真题库</h1></div><div class="hello">请输入密码</div><div class="sub">输对一次后，这台手机会记住</div>
    <form id="pwf" style="margin-top:14px"><input id="pw" type="password" inputmode="numeric" autocomplete="off" placeholder="密码" style="width:100%;box-sizing:border-box;font-size:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit">
    <div class="sub" id="pwe" style="color:var(--bad);min-height:20px;margin-top:6px"></div><button class="btn block">进入</button></form>`;
  const inp = $('#pw'); inp.focus();
  inp.oninput = () => { $('#pwe').textContent = ''; };
  return new Promise(res => {
    $('#pwf').onsubmit = e => {
      e.preventDefault();
      if (pwHash(inp.value.trim()) !== PW_HASH) { $('#pwe').textContent = inp.value ? '密码不对，再试一次' : '先输入密码'; inp.select(); return; }
      try { localStorage.setItem(PW_KEY, String(PW_HASH)); } catch (e2) { }
      app.innerHTML = `<div class="loadbox">正在载入题库…</div>`;
      res();
    };
  });
}

// ---------- 启动 ----------
(async function boot() {
  document.documentElement.style.setProperty('--fs', S.fs + 'px');
  await gate();
  try { IDX = await gzJSON('index.txt'); }
  catch (e) { app.innerHTML = `<div class="empty">题库没有加载成功，请检查网络后重新打开。<br><br><button class="btn" onclick="location.reload()">重新加载</button></div>`; return; }
  QM = IDX.qm;
  for (const pid in IDX.papers) for (const q of IDX.papers[pid].q) if (!FIRSTP[q]) FIRSTP[q] = pid;
  STACK = ['home'];
  render();
  // 微信内置浏览器常会清掉本地数据，做题记录会丢，提醒换浏览器打开（每次打开提醒一次）
  if (/MicroMessenger/i.test(navigator.userAgent)) {
    let seen = false; try { seen = sessionStorage.getItem('xc-wx') === '1'; sessionStorage.setItem('xc-wx', '1'); } catch (e) { }
    if (!seen) sheet(`<h3>建议用浏览器打开<button data-close>✕</button></h3><p>微信里打开时，做题记录和错题本可能会被微信清掉。</p><p>点右上角 <b>···</b>，选「<b>在浏览器打开</b>」，以后都从浏览器进来，记录就不会丢。</p><button class="btn block" data-close>知道了</button>`);
  }
  sync.start();
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.claude) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
